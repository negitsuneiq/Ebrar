<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffafa" />
    <meta
      name="description"
      content="Ebrar için sevgiyle hazırlanmış küçük bir sürpriz."
    />
    <title>Ebrar'a, sevgiyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="glow glow--one" aria-hidden="true"></div>
      <div class="glow glow--two" aria-hidden="true"></div>

      <p class="eyebrow">SANA KÜÇÜK BİR NOT</p>
      <h1>Ebrar’ı çok seviyorum</h1>
      <div class="heart-wrap" aria-hidden="true">
        <span class="line"></span>
        <span class="heart">♥</span>
        <span class="line"></span>
      </div>
      <p class="message">Bugün, yarın ve her güzel günde.</p>

      <button class="love-button" type="button" aria-label="Kalpleri göster">
        <span>Biraz sevgi bırak</span>
        <span aria-hidden="true">♡</span>
      </button>

      <div class="floating-hearts" aria-hidden="true"></div>
    </main>

    <footer>EBRAR İÇİN &nbsp;·&nbsp; SEVGİYLE</footer>
    <script src="script.js"></script>
  </body>
</html>
